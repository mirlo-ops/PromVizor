# ПромВизор — nginx перед приложением: TLS и доступ из интернета.
#
# Установка:
#   sudo cp deploy/nginx/promvizor.conf /etc/nginx/sites-available/promvizor
#   sudo ln -s /etc/nginx/sites-available/promvizor /etc/nginx/sites-enabled/
#   sudo certbot --nginx -d promvizor.example.ru
#   sudo nginx -t && sudo systemctl reload nginx
#
# Порт 8000 НЕ публикуется наружу (в compose он слушает 127.0.0.1) —
# в интернет смотрит только nginx. Иначе приложение будет доступно
# и по http, в обход сертификата, и в обход nginx.

# Ограничение по размеру ответа. MJPEG-поток /api/video/stream идёт
# бесконечно и nginx считает его незавершённым — ради него увеличены
# таймауты, а client_max_body_size его не касается (это про тело запроса).
client_max_body_size 1m;

upstream promvizor_api {
    server 127.0.0.1:8000;
    keepalive 8;
}

server {
    listen 80;
    listen [::]:80;
    server_name promvizor.example.ru;

    # Аккорд Let's Encrypt работает только на 80-м порту. Дальше
    # certbot сам перепишет этот блок и добавит редирект на https.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name promvizor.example.ru;

    # TLS 1.2/1.3. Старые шифры убраны: сертификат Let's Encrypt
    # без права выдавать их клиентам.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # ВНИМАНИЕ: эти пути выдаёт certbot. Разместите файлы через
    # certbot --nginx -d promvizor.example.ru, иначе nginx не стартует.
    ssl_certificate     /etc/letsencrypt/live/promvizor.example.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/promvizor.example.ru/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;

    # --- Кадры с камеры браузера ---
    #
    # Браузер шлёт JPEG телом запроса (POST /api/video/browser/frame),
    # а общий client_max_body_size выше — 1 МБ. Кадр 1280×720 в JPEG
    # обычно 150–300 КБ, но телефон может прислать больше: при жёстком
    # лимите браузер получал бы 413 и демонстрация выглядела бы как
    # «камера не работает». Здесь лимит свой и заведомо достаточный.
    location /api/video/browser/ {
        proxy_pass http://promvizor_api;
        proxy_http_version 1.1;

        client_max_body_size 8m;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 30s;
    }

    # --- Видеопоток ---
    #
    # Отдельный location не изящество, а необходимость. Буферизация
    # nginx накапливает кадры и отдаёт пачкой раз в полсекунды —
    # картинка в окне камеры «дёргалась» бы и отставала. Плюс
    # multipart без Content-Length nginx считает бесконечным и
    # обрывает соединение стандартным таймаутом в 60 секунд.
    location /api/video/ {
        proxy_pass http://promvizor_api;
        proxy_http_version 1.1;

        proxy_buffering off;          # кадры сразу клиенту
        proxy_cache off;
        proxy_read_timeout 3600s;     # живой поток не имеет конца
        proxy_send_timeout 3600s;
        chunked_transfer_encoding on;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- Остальное приложение ---
    location / {
        proxy_pass http://promvizor_api;
        proxy_http_version 1.1;

        # Статика отдаётся с Cache-Control: no-cache из приложения —
        # nginx здесь ничего не кэширует и заголовки не переписывает.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # Без заголовка схемы приложение не сможет собрать
        # абсолютные ссылки (например, в /docs) и сочтёт себя
        # работающим по http.
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_read_timeout    60s;
    }

    # --- Документация API ---
    #
    # /docs и /openapi.json показывают внутреннюю схему сервиса.
    # На публичном сервере их лучше закрыть: снаружи не нужны, а
    # показывают наружу карту API.
    location /docs {
        # Раскомментируйте, чтобы открыть обратно:
        # allow 203.0.113.10;   # ваш IP
        deny all;
    }
    location = /openapi.json {
        deny all;
    }
}