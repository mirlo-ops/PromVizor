[pytest]
# Тесты телеграм-бота (Этап 8) — асинхронные: они проверяют команды и
# уведомления через реальный asyncio-цикл. Без этого режима pytest
# отказывается запускать `async def test_...` и падает на «no current
# event loop», то есть проверки бота просто не выполняются.
asyncio_mode = auto
testpaths = tests