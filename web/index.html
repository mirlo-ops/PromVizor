<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ПромВизор — Контроль персонала</title>
<meta name="theme-color" content="#f7f9f9">
<script>
  // Ставим тему до отрисовки, иначе тёмная тема мигает светлой
  try {
    var s = JSON.parse(localStorage.getItem('pv_settings') || '{}');
    document.documentElement.setAttribute('data-theme', s.theme === 'dark' ? 'dark' : 'light');
  } catch (e) {}
</script>
<link rel="stylesheet" href="css/styles.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>&#128230;</text></svg>">
</head>
<body>

<div class="app" id="app">

  <!-- ============ SIDEBAR ============ -->
  <aside class="sidebar" id="sidebar">
    <div class="brand" id="brandBtn" role="button" tabindex="0" title="На главный экран">
      <span class="brand-logo" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round">
          <path d="M12 2.4 21 7.2v9.6L12 21.6 3 16.8V7.2z"/>
          <path d="M3 7.2 12 12l9-4.8M12 12v9.6"/>
        </svg>
      </span>
      <span class="brand-text">
        <strong>ПромВизор</strong>
        <small>Контроль персонала</small>
      </span>
    </div>

    <nav class="nav" id="nav">
      <button class="nav-item is-active" data-section="monitoring">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>
        <span>Мониторинг</span>
      </button>
      <button class="nav-item" data-section="employees">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3.2"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0M16.5 5.6a3.2 3.2 0 0 1 0 5.8M18 14.4a6.5 6.5 0 0 1 3.5 5.6"/></svg>
        <span>Сотрудники</span>
      </button>
      <button class="nav-item" data-section="reports">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="3" width="16" height="18" rx="2.5"/><path d="M8.5 8h7M8.5 12h7M8.5 16h4"/></svg>
        <span>Отчёты</span>
      </button>
      <button class="nav-item" data-section="settings">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6h.09A1.65 1.65 0 0 0 10 3.09V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        <span>Настройки</span>
      </button>
    </nav>

    <div class="sidebar-foot">
      <button class="system-pill" id="systemPill" title="Состояние системы">
        <span class="dot dot-green" id="systemDot"></span>
        <span id="systemText">Система работает</span>
        <svg class="chev" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg>
      </button>
    </div>
  </aside>

  <!-- ============ MAIN ============ -->
  <main class="main">

    <header class="topbar">
      <div class="topbar-left">
        <div class="dd" id="yearSelect">
          <button class="dd-btn dd-year" data-dd="year" aria-haspopup="listbox" aria-expanded="false">
            <span id="yearLabel">2026</span>
            <svg class="chev-down" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
          </button>
          <div class="dd-menu dd-menu-year" data-menu="year" role="listbox" hidden></div>
        </div>
        <div class="employees-total" id="employeesTotal">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="7.5" r="3.5"/><path d="M4.5 21a7.5 7.5 0 0 1 15 0"/></svg>
          <span><b id="employeesCount">120</b> сотрудников</span>
        </div>
      </div>
      <div class="topbar-right">
        <span class="clock"><span class="dot dot-green" id="clockDot"></span><b id="clockTime">14:32</b></span>
      </div>
    </header>

    <!-- tabs only for monitoring -->
    <nav class="tabs" id="tabs">
      <button class="tab" data-tab="lines">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M2.5 15.5h19"/>
          <circle cx="6" cy="18.5" r="1.35"/>
          <circle cx="10.5" cy="18.5" r="1.35"/>
          <circle cx="15" cy="18.5" r="1.35"/>
          <circle cx="19.5" cy="18.5" r="1.35"/>
          <path d="M2.5 15.5v2M21.5 15.5v2"/>
          <rect x="5.5" y="5" width="7" height="6" rx="1"/>
          <path d="M5.5 8h7M9 5v6"/>
          <path d="M16.5 5v6h-2"/>
        </svg>
        <span>Линии</span>
      </button>
      <button class="tab is-active" data-tab="cameras">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="6" width="18" height="13" rx="2.5"/><circle cx="12" cy="12.5" r="3.6"/><path d="M8 6l1.2-2.5h5.6L16 6"/></svg>
        <span>Камеры</span>
      </button>
      <button class="tab" data-tab="overview">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="3" width="16" height="18" rx="2.5"/><path d="M8.5 8h7M8.5 12h7M8.5 16h4"/></svg>
        <span>Сводная</span>
      </button>
    </nav>

    <div class="content" id="content"></div>

  </main>
</div>

<div class="toasts" id="toasts"></div>

<script src="js/data.js"></script>
<script src="js/components.js"></script>
<script src="js/sections.js"></script>
<script src="js/app.js"></script>
</body>
</html>
