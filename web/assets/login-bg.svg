<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000"
     preserveAspectRatio="xMidYMid slice" role="img" aria-label="">
  <defs>
    <!-- Основной диагональный градиент: слева темно, справа зеленее.
         Такой разворот тона был на присланном образце. -->
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#081C15"/>
      <stop offset="38%"  stop-color="#0E221B"/>
      <stop offset="72%"  stop-color="#265A43"/>
      <stop offset="100%" stop-color="#52B788"/>
    </linearGradient>

    <!-- Блик сверху слева: даёт объём, ффон перестаёт быть плоской
         заливкой. -->
    <radialGradient id="glow-a" cx="0.18" cy="0.12" r="0.75">
      <stop offset="0%"   stop-color="#52B788" stop-opacity=".55"/>
      <stop offset="60%"  stop-color="#265A43" stop-opacity=".18"/>
      <stop offset="100%" stop-color="#081C15" stop-opacity="0"/>
    </radialGradient>

    <!-- Второй, более слабый блик внизу справа. -->
    <radialGradient id="glow-b" cx="0.88" cy="0.92" r="0.6">
      <stop offset="0%"   stop-color="#D8F3DC" stop-opacity=".38"/>
      <stop offset="70%"  stop-color="#52B788" stop-opacity=".12"/>
      <stop offset="100%" stop-color="#081C15" stop-opacity="0"/>
    </radialGradient>

    <!-- Затемнение к центру: карточка входа должна читаться на любом
         фоне, а под светлым бликом её края сливались бы с подложкой. -->
    <radialGradient id="veil" cx="0.5" cy="0.5" r="0.72">
      <stop offset="0%"   stop-color="#081C15" stop-opacity=".46"/>
      <stop offset="55%"  stop-color="#081C15" stop-opacity=".12"/>
      <stop offset="100%" stop-color="#081C15" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="1000" fill="url(#base)"/>
  <rect width="1600" height="1000" fill="url(#glow-a)"/>
  <rect width="1600" height="1000" fill="url(#glow-b)"/>
  <rect width="1600" height="1000" fill="url(#veil)"/>
</svg>
